{% extends "panel/base.html" %}
{% block title %}İmtahanı sil{% endblock %}
{% block content %}
<section class="hero-bar">
  <div class="hero-ico">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
  </div>
  <div>
    <h1>İmtahanı sil</h1>
    <p>«{{ exam.title }}» və ona bağlı suallar, nəticələr, sertifikatlar silinəcək.</p>
  </div>
</section>
<section class="panel-card">
  <p>Bu əməliyyat geri qaytarılmır.</p>
  <form method="post" class="footer-bar" style="margin-top:16px">
    {% csrf_token %}
    <a class="btn" href="{% url 'panel_exams' %}">Ləğv et</a>
    <button class="btn danger" type="submit">Bəli, sil</button>
  </form>
</section>
{% endblock %}
